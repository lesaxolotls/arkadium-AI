<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <title>Arkadium AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">A</div>

            <div>
                <h1>ARKADIUM AI</h1>
                <span>
                    <i class="status-dot"></i>
                    Assistant vocal
                </span>
            </div>
        </div>

        <button id="clearBtn" class="clear-btn">
            Nouvelle conversation
        </button>
    </header>


    <main id="chat" class="chat">

        <section class="welcome">

            <div class="robot">🤖</div>

            <h2>Bonjour 👋</h2>

            <p>
                Je suis <strong>Arkadium AI</strong>.<br>
                Écris-moi ou parle-moi.
            </p>

        </section>

    </main>


    <section class="input-panel">

        <div id="transcription" class="transcription">
            Prêt à discuter
        </div>

        <div class="input-box">

            <button id="micBtn"
                    class="mic-btn"
                    aria-label="Parler">
                🎙️
            </button>

            <input
                id="textInput"
                type="text"
                placeholder="Écris ton message..."
                autocomplete="off"
            >

            <button id="sendBtn"
                    class="send-btn"
                    aria-label="Envoyer">
                ➤
            </button>

        </div>

        <div id="status" class="status">
            Prêt
        </div>

    </section>


    <footer>
        <span>ARKADIUM AI</span>
        <span>V1 • Gratuit</span>
    </footer>

</div>

<script src="app.js"></script>

</body>
</html>
